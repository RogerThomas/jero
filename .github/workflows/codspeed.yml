name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
  # Lets CodSpeed trigger backtest runs to build initial history.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codspeed:
    name: CPU (CodSpeed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    concurrency:
      group: codspeed-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      # The per-test timeout is meant for the test suite; CPU simulation runs far slower
      # than native, so it is disabled for the benchmarks.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest benchmarks/codspeed --codspeed --timeout=0
