name: HTTP benchmarks (release A/B diagnostic)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per measured attempt (1-60)
        type: number
        default: 10
      runs:
        description: Attempts per framework and workload (1-5)
        type: number
        default: 3
      vus:
        description: Concurrent virtual users (1-128)
        type: number
        default: 32

permissions:
  contents: read

concurrency:
  group: http-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.4'
          python-version: '3.14'
          enable-cache: true

      - uses: docker/setup-buildx-action@v4

      - name: Build shared app and load-generator images
        uses: docker/bake-action@v7
        with:
          source: .
          files: benchmarks/ci/docker-bake.hcl
          load: true
          set: |
            app.cache-from=type=gha,scope=jero-benchmark-app
            app.cache-to=type=gha,mode=max,scope=jero-benchmark-app
            runner.cache-from=type=gha,scope=jero-benchmark-runner
            runner.cache-to=type=gha,mode=max,scope=jero-benchmark-runner
            upstream.cache-from=type=gha,scope=jero-benchmark-upstream
            upstream.cache-to=type=gha,mode=max,scope=jero-benchmark-upstream

      - name: Install benchmark dependencies and the checked-out jero
        run: uv sync --frozen --no-dev --group benchmark

      - name: Run current checkout
        env:
          BENCHMARK_DURATION: ${{ inputs.duration }}
          BENCHMARK_RUNS: ${{ inputs.runs }}
          BENCHMARK_VUS: ${{ inputs.vus }}
        run: |
          uv run --no-sync yeet ./benchmarks/ci/run.py \
            --duration "$BENCHMARK_DURATION" \
            --runs "$BENCHMARK_RUNS" \
            --vus "$BENCHMARK_VUS" --output benchmark-results/checkout

      - name: Build published jero 0.1.1 with the same dependencies
        uses: docker/bake-action@v7
        with:
          source: .
          files: benchmarks/ci/docker-bake.hcl
          targets: app,runner
          load: true
          set: |
            app.args.JERO_VERSION=0.1.1
            runner.args.JERO_VERSION=0.1.1

      - name: Run published release on the same machine
        env:
          BENCHMARK_DURATION: ${{ inputs.duration }}
          BENCHMARK_RUNS: ${{ inputs.runs }}
          BENCHMARK_VUS: ${{ inputs.vus }}
        run: |
          uv run --no-sync yeet ./benchmarks/ci/run.py \
            --duration "$BENCHMARK_DURATION" \
            --runs "$BENCHMARK_RUNS" \
            --vus "$BENCHMARK_VUS" --output benchmark-results/release-0.1.1

      - name: Publish report in the workflow summary
        if: always()
        run: |
          for profile in checkout release-0.1.1; do
            echo "## $profile" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "benchmark-results/$profile/report.md" ]; then
              cat "benchmark-results/$profile/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Save report and raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.sha }}-${{ github.run_attempt }}
          path: benchmark-results/
          retention-days: 30
          if-no-files-found: warn
