name: pr-title

# PRs are squash-merged with the PR title as the commit message, and release-please
# reads those commits to pick the next version and write the changelog — so the title
# must be a Conventional Commit (`feat: ...`, `fix: ...`, `feat!: ...`).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
