name: release-main

# release-please keeps a release PR open against main (version bump in pyproject.toml +
# uv.lock, CHANGELOG.md entry), driven by the Conventional Commit PR titles merged since
# the last release. Merging that PR tags + creates the GitHub release, then publishes to
# PyPI and deploys the docs, all in this one run. (A release created with GITHUB_TOKEN
# fires no `release` event for another workflow, hence one workflow rather than two. The
# filename is also the one PyPI Trusted Publishing is bound to: don't rename it.)
on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:

  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no PyPI token needed. The environment name
    # must match the one configured on the PyPI publisher ("pypi").
    environment:
      name: pypi
      url: https://pypi.org/p/jero
    permissions:
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      # pyproject.toml is the single source of truth for the version; release-please
      # bumps it and the tag together, so a mismatch here means the config drifted.
      - name: Verify the release tag matches the pyproject version
        run: |
          version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag="${{ needs.release-please.outputs.tag_name }}"
          if [ "$version" != "$tag" ]; then
            echo "::error::release tag '$tag' does not match pyproject version '$version' — check release-please-config.json"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish

  deploy-docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: |
          uv run zensical build --clean
          uv run yeet ./scripts/build_agent_docs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
