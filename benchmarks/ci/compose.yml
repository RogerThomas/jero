services:
  postgres:
    image: postgres:18-alpine
    cpus: "${BENCHMARK_BACKEND_CPU_COUNT:-1}"
    cpuset: "${BENCHMARK_DATABASE_CPUS:-3}"
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30

  upstream:
    image: jero-benchmark-upstream:local
    pull_policy: never
    cpus: "${BENCHMARK_BACKEND_CPU_COUNT:-1}"
    cpuset: "${BENCHMARK_UPSTREAM_CPUS:-3}"
    environment:
      UPSTREAM_API_KEY: benchmark-upstream-key
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}

  app:
    image: jero-benchmark-app:local
    pull_policy: never
    cpus: 1.0
    cpuset: "${BENCHMARK_APP_CPU:-0}"
    environment:
      BENCHMARK_DATABASE_DSN: postgresql://benchmark:benchmark@postgres:5432/benchmark
      BENCHMARK_UPSTREAM_URL: http://upstream:8001
    depends_on:
      postgres:
        condition: service_healthy

  benchmark:
    image: jero-benchmark-runner:local
    pull_policy: never
    cpus: "${BENCHMARK_LOAD_CPU_COUNT:-2}"
    cpuset: "${BENCHMARK_LOAD_CPUS:-1,2}"
    environment:
      BENCHMARK_COMMIT: "${BENCHMARK_COMMIT:-local}"
      BENCHMARK_RUN_URL: "${BENCHMARK_RUN_URL:-}"
      BENCHMARK_APP_CPU: "${BENCHMARK_APP_CPU:-0}"
      BENCHMARK_LOAD_CPUS: "${BENCHMARK_LOAD_CPUS:-1,2}"
      BENCHMARK_DATABASE_CPUS: "${BENCHMARK_DATABASE_CPUS:-3}"
      BENCHMARK_UPSTREAM_CPUS: "${BENCHMARK_UPSTREAM_CPUS:-3}"
    command:
      - --duration
      - "${BENCHMARK_DURATION:-10}"
      - --runs
      - "${BENCHMARK_RUNS:-3}"
      - --vus
      - "${BENCHMARK_VUS:-32}"
      - --warmup
      - "${BENCHMARK_WARMUP:-2}"
    volumes:
      - "${BENCHMARK_OUTPUT:-../../benchmark-results}:/results"
    depends_on:
      app:
        condition: service_started
      upstream:
        condition: service_started
